name: Zero-Trust Policy-as-Code Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  policy-as-code-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/workloads

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::505820274676:role/zt-github-actions-role
          aws-region: eu-west-3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform Init & Plan JSON
        run: |
          terraform init
          terraform validate
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json

      - name: Run Checkov Static Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/workloads
          framework: terraform
          config_file: .checkov.yaml
          soft_fail: false

      - name: Setup Conftest (OPA)
        uses: open-policy-agent/setup-conftest@v1

      - name: Run OPA Rego Policies
        run: conftest test tfplan.json -p ../../policies/opa