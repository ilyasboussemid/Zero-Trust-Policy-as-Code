server:
  port: 8443
  ssl:
    enabled: true
    client-auth: need
    key-store: classpath:certs/storage-vault-service.p12
    key-store-password: changeit
    key-store-type: PKCS12
    trust-store: classpath:certs/truststore.p12
    trust-store-password: changeit
    trust-store-type: PKCS12

spring:
  application:
    name: storage-vault-service

zerotrust:
  storage:
    mode: local
